[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-pdf"
version = "2.0.0"
description = "Turn lecture video into PDF handouts, including the lecturer's handwriting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuhyeon Lee" }]
keywords = ["lecture", "slides", "video", "pdf", "ocr", "annotation", "opencv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Education",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
]

[project.urls]
Repository = "https://github.com/blueion0612/Lecture_PDF"
Changelog = "https://github.com/blueion0612/Lecture_PDF/blob/main/CHANGELOG.md"
Portfolio = "https://blueion0612.github.io"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
lecture-pdf = "lecture_pdf.cli:main"

[tool.setuptools]
packages = ["lecture_pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixtures are rendered on first run and cached; they are not committed.
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
