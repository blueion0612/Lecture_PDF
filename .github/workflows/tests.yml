name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (headless OpenCV, no display on a runner)
        run: |
          pip install -e ".[dev]"
          pip install --force-reinstall opencv-python-headless
      - name: Unit tests, and requirements.txt against pyproject.toml
        run: python -m pytest -q
      - name: Every entry point resolves, as a command, a module and the root script
        run: |
          lecture-pdf --help > /dev/null
          python -m lecture_pdf.cli --help > /dev/null
          python lecture_video_to_pdf.py --help > /dev/null
